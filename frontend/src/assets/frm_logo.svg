<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1B5B96" />
      <stop offset="55%" stop-color="#0F3B66" />
      <stop offset="100%" stop-color="#05192D" />
    </radialGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB38" />
      <stop offset="50%" stop-color="#F88A01" />
      <stop offset="100%" stop-color="#D96E00" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F88A01" />
      <stop offset="50%" stop-color="#2D72B5" />
      <stop offset="100%" stop-color="#F88A01" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#ringGrad)" stroke-width="8" />
  
  <!-- Subtle Inner Guide Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Industrial Gear Motif (Center-Top) -->
  <g filter="url(#shadow)" transform="translate(256, 172)">
    <!-- Rotating Gear Teeth -->
    <path fill="url(#orangeGrad)" d="
      M -20 -82 L 20 -82 L 24 -62 Q 38 -56 50 -48 L 68 -58 L 96 -30 L 86 -12 Q 94 0 98 14 L 118 18 L 118 58 L 98 62 Q 94 76 86 88 L 96 106 L 68 134 L 50 124 Q 38 132 24 138 L 20 158 L -20 158 L -24 138 Q -38 132 -50 124 L -68 134 L -96 106 L -86 88 Q -94 76 -98 62 L -118 58 L -118 18 L -98 14 Q -94 0 -86 -12 L -96 -30 L -68 -58 L -50 -48 Q -38 -56 -24 -62 Z
    " transform="scale(0.85) translate(0, -35)" opacity="0.95" />
    
    <!-- Gear Core -->
    <circle cx="0" cy="-30" r="42" fill="#0A2C4F" stroke="#F88A01" stroke-width="4" />
    <circle cx="0" cy="-30" r="20" fill="url(#orangeGrad)" />
  </g>

  <!-- Factory Silhouette Motif -->
  <g filter="url(#shadow)">
    <!-- Factory Roof Sawteeth & Building Base -->
    <path fill="url(#whiteGrad)" d="
      M 112 280 
      L 164 228 L 164 280 
      L 220 228 L 220 280 
      L 276 228 L 276 280 
      L 332 228 L 332 280 
      L 400 280 
      L 400 326 
      L 112 326 Z
    " />
    <!-- Chimneys / Smokestacks -->
    <rect x="136" y="196" width="16" height="36" fill="url(#whiteGrad)" rx="2" />
    <rect x="192" y="184" width="16" height="48" fill="url(#whiteGrad)" rx="2" />
    <rect x="360" y="190" width="22" height="90" fill="url(#whiteGrad)" rx="3" />

    <!-- Factory Windows Grid -->
    <rect x="132" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="168" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="204" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="240" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="276" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="312" y="294" width="20" height="20" fill="#0F3B66" rx="3" />
    <rect x="352" y="294" width="30" height="32" fill="#F88A01" rx="4" />
  </g>

  <!-- Lower Branding Banner Plate -->
  <g filter="url(#shadow)">
    <rect x="64" y="342" width="384" height="114" rx="20" fill="#05192D" stroke="#1E5A96" stroke-width="3" />
    <rect x="70" y="348" width="372" height="102" rx="16" fill="none" stroke="#F88A01" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- FRM-BBP Monogram -->
    <text x="256" y="415" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      FRM-<tspan fill="#F88A01">BBP</tspan>
    </text>
  </g>
</svg>

