name: Build & Publish FRM Server Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-server-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build FRM Server Package
        run: npm run package:server

      - name: Publish rolling server-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-latest
          name: FRM Server Latest Build
          make_latest: true
          files: |
            dist/FRM-Server-Package.zip
            dist/FRM-Server-Package/version.json
